<html lang="ja">

<title>ライドカード</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ライドカード">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#141517;--panel:#1c1e21;--line:#2c2f34;--ink:#eceae4;--mute:#8b8f95}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:15px;line-height:1.5}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.wrap{max-width:520px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 0 12px}
header h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
header h1 img{width:34px;height:34px;border-radius:8px;display:block}
.link{background:none;border:0;color:var(--mute);font:inherit;font-size:13px;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick .wide{grid-column:1/-1}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;text-align:center;overflow:hidden;position:relative}
.btn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.btn span{pointer-events:none}
.btn small{display:block;color:var(--mute);font-size:11px;font-weight:400;max-width:100%;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.btn.done{border-color:#5a5e66}
.stage{margin:14px auto 6px;display:flex;justify-content:center}
#cv{display:block;height:min(62vh,640px);aspect-ratio:9/16;max-width:100%;border-radius:14px;background:#000;touch-action:none;box-shadow:0 0 0 1px var(--line)}
.hint{text-align:center;color:var(--mute);font-size:12px;min-height:18px;margin:0 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:start;min-height:40px;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#141517;border-color:var(--ink)}
.row{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row label{color:var(--mute);font-size:13px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-height:38px;border:0;background:transparent;color:var(--mute);font:inherit;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:700}
input[type=range]{width:100%;accent-color:#eceae4;height:32px}
details{margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
summary{cursor:pointer;color:var(--mute);font-size:13px;padding:8px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";float:right}
details[open] summary::after{content:"－"}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 0 8px}
.fields label{display:block;font-size:12px;color:var(--mute)}
.fields input{width:100%;margin-top:4px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;font-size:16px}
.fields input:focus-visible,.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,.link:focus-visible,.save:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 70%,rgba(20,21,23,0))}
.save{display:block;width:100%;max-width:488px;margin:0 auto;min-height:52px;border:0;border-radius:14px;background:var(--ink);color:#141517;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.raw{margin:0 0 8px;font-size:11px;color:var(--mute);word-break:break-all}
.msg{color:#e6b8a8;font-size:13px;min-height:18px;margin:6px 0 0}
.sw{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.sw button.auto{width:auto;border-radius:999px;padding:0 14px;background:transparent;color:var(--ink);font:inherit;font-size:13px}
.sw button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.save{transition:background .15s,color .15s,border-color .15s}}
</style>
</head>

  <div class="pick">

<script>
(() => {
'use strict';
const W = 1080, H = 1920, M = 64;
const cv = document.getElementById('cv'), c = cv.getContext('2d');
const F = {
  num: '"Barlow","Helvetica Neue",Arial,sans-serif',
  cond: '"Barlow Condensed","Arial Narrow",Arial,sans-serif'
};
const st = { img: null, zoom: 1, ox: 0, oy: 0, preset: 'auto', autoIdx: 0, text: 'auto', scrim: 0.4,
  route: null, prof: null, speedAuto: false, panel: 'auto', logo: true, vals: { dist: '', time: '', speed: '', elev: '', max: '' }, date: '', coord: '' };
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fnt = (size, fam, wt) => `${wt || 500} ${Math.round(size)}px ${F[fam || 'num']}`;

/* ---------- photo ---------- */
const bgc = document.createElement('canvas'); bgc.width = 24; bgc.height = 43;
function drawPhoto(g, k) {
  const img = st.img;
  if (!img) {
    const gr = g.createLinearGradient(0, 0, W * k, H * k);
    gr.addColorStop(0, '#2f353d'); gr.addColorStop(1, '#0f1113');
    g.fillStyle = gr; g.fillRect(0, 0, W * k, H * k); return;
  }
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const s0 = Math.max(W / iw, H / ih), s = s0 * st.zoom, dw = iw * s, dh = ih * s;
  const mx = Math.abs(dw - W) / 2, my = Math.abs(dh - H) / 2;
  st.ox = clamp(st.ox, -mx, mx); st.oy = clamp(st.oy, -my, my);
  if (dw < W - 0.5 || dh < H - 0.5) {
    const bb = bgc.getContext('2d'); bb.clearRect(0, 0, 24, 43);
    const bk = 24 / W, bw = iw * s0 * bk, bh = ih * s0 * bk;
    bb.drawImage(img, (24 - bw) / 2, (43 - bh) / 2, bw, bh);
    g.save(); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    g.drawImage(bgc, 0, 0, W * k, H * k);
    g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(0, 0, W * k, H * k); g.restore();
  }
  g.drawImage(img, ((W - dw) / 2 + st.ox) * k, ((H - dh) / 2 + st.oy) * k, dw * k, dh * k);
}

/* ---------- photo analysis (for おまかせ) ---------- */
const SW = 54, SH = 96;
const sm = document.createElement('canvas'); sm.width = SW; sm.height = SH;
function analyze() {
  const g = sm.getContext('2d', { willReadFrequently: true });
  g.clearRect(0, 0, SW, SH); drawPhoto(g, SW / W);
  const d = g.getImageData(0, 0, SW, SH).data, n = SW * SH;
  const lum = new Float32Array(n); let sum = 0, R = 0, G = 0, B = 0;
  for (let i = 0; i < n; i++) { lum[i] = (0.2126 * d[i * 4] + 0.7152 * d[i * 4 + 1] + 0.0722 * d[i * 4 + 2]) / 255; sum += lum[i]; R += d[i * 4]; G += d[i * 4 + 1]; B += d[i * 4 + 2]; }
  const e = new Float32Array(n);
  for (let y = 1; y < SH - 1; y++) for (let x = 1; x < SW - 1; x++) {
    const i = y * SW + x;
    e[i] = Math.abs(lum[i + 1] - lum[i - 1]) + Math.abs(lum[i + SW] - lum[i - SW]);
  }
  const busy = (x, y, w, h) => {
    const x0 = clamp(Math.floor(x / W * SW), 0, SW - 1), x1 = clamp(Math.ceil((x + w) / W * SW), x0 + 1, SW);
    const y0 = clamp(Math.floor(y / H * SH), 0, SH - 1), y1 = clamp(Math.ceil((y + h) / H * SH), y0 + 1, SH);
    let s = 0, q = 0;
    for (let yy = y0; yy < y1; yy++) for (let xx = x0; xx < x1; xx++) { s += e[yy * SW + xx]; q++; }
    return s / q;
  };
  return { mean: sum / n, busy, rgb: [R / n, G / n, B / n] };
}
function rank(A) {
  const cB = A.busy(270, 480, 540, 960), aB = A.busy(0, 0, W, H), bB = A.busy(0, 1180, W, 740);
  const s = { hero: 2.0 - cB * 14, glass: 1.8 - bB * 14, minimal: 0.4 + cB * 10,
    solus: 1.2 - aB * 6, big: 1.0 - aB * 5, poster: 0.9 - aB * 5,
    panel: 1.4 - aB * 3, frame: 1.2 - aB * 3, table: 0.7 + (A.mean < 0.45 ? 0.7 : 0) - aB * 2 };
  return Object.keys(s).sort((a, b) => s[b] - s[a]);
}

/* ---------- stats / formatting ---------- */
function fmtTime(v) {
  const m = String(v).match(/(\d+)\s*(?:[:h時]|時間)\s*(\d+)?/i);
  if (m) return `${+m[1]}h ${String(+(m[2] || 0)).padStart(2, '0')}m`;
  return v || '--';
}
function display() {
  const v = st.vals;
  return { dist: v.dist || '--', time: fmtTime(v.time), speed: v.speed || '--', elev: v.elev || '--', max: v.max || '--',
    date: st.date, coord: st.coord };
}

/* ---------- drawing helpers ---------- */
function theme(A, id) {
  const light = st.text === 'auto' ? A.mean > 0.66 : st.text === 'black';
  const warm = id === 'poster';
  return { light, a: st.scrim, base: light ? '255,255,255' : '0,0,0',
    fg: light ? (warm ? '#1a1713' : '#101113') : (warm ? '#f4ecd8' : '#ffffff'),
    sub: light ? 'rgba(16,17,19,.72)' : 'rgba(255,255,255,.78)' };
}
function scrim(T, mode, k) {
  const a = Math.min(1, T.a * (k || 1));
  c.save();
  if (mode === 'bottom') {
    const g = c.createLinearGradient(0, H * 0.38, 0, H);
    g.addColorStop(0, `rgba(${T.base},0)`); g.addColorStop(1, `rgba(${T.base},${Math.min(1, a * 1.8)})`);
    c.fillStyle = `rgba(${T.base},${a * 0.3})`; c.fillRect(0, 0, W, H);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
  } else { c.fillStyle = `rgba(${T.base},${a})`; c.fillRect(0, 0, W, H); }
  c.restore();
}
function shadow(T) { if (!T.light) { c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 14; } }
function stat(T, o) {
  let { label, value, unit = '', x, y, align = 'left', vs = 96, ls = 36, fam = 'num', max, wt = 500 } = o;
  let us = o.us || vs * 0.4;
  c.save(); shadow(T); c.textBaseline = 'alphabetic';
  const meas = () => {
    c.font = fnt(vs, fam, wt); const vw = c.measureText(value).width;
    c.font = fnt(us, fam, 500); const uw = unit ? c.measureText(unit).width : 0;
    return [vw, uw, unit ? vs * 0.14 : 0];
  };
  let [vw, uw, gap] = meas();
  if (max && vw + uw + gap > max) { const f = max / (vw + uw + gap); vs *= f; us *= f; [vw, uw, gap] = meas(); }
  const total = vw + uw + gap;
  const sx = align === 'right' ? x - total : align === 'center' ? x - total / 2 : x;
  c.textAlign = align === 'right' ? 'right' : align === 'center' ? 'center' : 'left';
  c.font = fnt(o.ls || ls, 'num', 400); c.fillStyle = T.sub; c.fillText(label, x, y);
  const vy = y + (o.ls || ls) * 0.25 + vs * 0.86 + 6;
  c.textAlign = 'left'; c.fillStyle = T.fg;
  c.font = fnt(vs, fam, wt); c.fillText(value, sx, vy);
  if (unit) { c.font = fnt(us, fam, 500); c.fillText(unit, sx + vw + gap, vy); }
  c.restore();
  return vy;
}
function text(T, str, x, y, size, o) {
  o = o || {};
  c.save(); if (!o.noShadow) shadow(T);
  c.font = fnt(size, o.fam || 'num', o.wt || 500); c.fillStyle = o.color || T.fg; c.textAlign = o.align || 'left';
  c.textBaseline = 'alphabetic'; c.fillText(str, x, y); c.restore();
}
function vtext(T, str, x, y, rot, size) {
  c.save(); shadow(T); c.translate(x, y); c.rotate(rot);
  c.font = fnt(size, 'num', 500); c.fillStyle = T.sub; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(str, 0, 0); c.restore();
}
function line(T, x1, y1, x2, y2, lw, alpha) {
  c.save(); c.strokeStyle = T.fg; c.globalAlpha = alpha == null ? 0.7 : alpha; c.lineWidth = lw || 2;
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); c.restore();
}
function route(T, box, o) {
  const r = st.route; if (!r) return;
  o = o || {};
  const s = Math.min(box.w / r.w, box.h / r.h);
  const ox = box.x + (box.w - r.w * s) / 2, oy = box.y + (box.h - r.h * s) / 2;

  for (const r of res.slice(1)) for (const k of Object.keys(r.p)) if (!best[k] && statScore(Object.assign({}, best, { [k]: r.p[k] })) >= statScore(best)) best[k] = r.p[k];
  return { p: best, raw: res[0].txt, info };
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
$('rimg').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  msg('ルート画像を解析中…');
  try {
    const cvs = await loadPhoto(f, 2000);
    const id = cvs.getContext('2d').getImageData(0, 0, cvs.width, cvs.height);
    const r = routeFromRGBA(id.data, cvs.width, cvs.height);
    if (!r) throw new Error('オレンジ色のルート線が見つかりませんでした。背景が透明なルート画像で試してください。');
    st.route = r; st.prof = null; st.coord = ''; st.date = fmtDate(new Date()); st.speedAuto = true;
    setVals({ dist: '', time: '', speed: '', elev: '', max: '' });
    $('rimgName').textContent = f.name; $('rimgBtn').classList.add('done'); $('gpxBtn').classList.remove('done'); $('gpxName').textContent = '';
    $('vals').open = true; $('ocrRaw').textContent = ''; schedule();
    msg('ルートを取り込みました。数値を読み取り中…（初回は言語データ約2MBを読み込みます）');
    try {
      const rs = await withTimeout(readStats(cvs), 180000), p = rs.p;
      $('ocrRaw').textContent = rs.raw ? '読み取った文字：' + rs.raw.replace(/\n+/g, ' / ') : '';
      const v = Object.assign({ dist: '', time: '', speed: '', elev: '', max: '' }, p);
      st.speedAuto = !p.speed; setVals(v); if (!p.speed) autoSpeed();
      const got = [p.dist && `距離 ${p.dist}km`, p.elev && `獲得標高 ${p.elev}m`, p.time && `タイム ${p.time}`, p.speed && `速度 ${p.speed}km/h`].filter(Boolean);
      msg(got.length ? `読み取り結果：${got.join(' / ')}。違っていたら「数値を直す」で修正できます。` + (p.dist && p.speed && p.time && statScore(p) < 8 ? '（距離・タイム・速度が合わないので、どれかが読み違いかもしれません。確認してください）' : '') : rs.info.whiteFlat ? 'この画像は透明部分が白く塗りつぶされていて、白い文字が消えています。写真アプリではなく「ファイル」アプリ（ファイルを選択）から、保存したままの画像を選んでください。' : '数値を読み取れませんでした。「数値を直す」に手入力してください。');
    } catch (err) {
      const why = String((err && err.message) || err).slice(0, 260);
      $('ocrRaw').textContent = 'エラー：' + why;
      msg('数値の自動読み取りができませんでした。原因：' + why + ' ／ 「数値を直す」に手入力してください。');
    }
    schedule();
  } catch (err) { msg((err && err.message) || 'ルート画像を読み込めませんでした'); }
  e.target.value = '';
});
function autoSpeed() {
  if (!st.speedAuto) return;
  const d = parseFloat(st.vals.dist), m = String(st.vals.time).match(/(\d+)\s*(?:[:h時]|時間)\s*(\d+)?/i);
  if (d > 0 && m) { const hrs = +m[1] + (+(m[2] || 0)) / 60; if (hrs > 0) { const v = (d / hrs).toFixed(2); st.vals.speed = v; $('fSpeed').value = v; } }
}
['fDist', 'fTime'].forEach(id => $(id).addEventListener('input', () => { autoSpeed(); schedule(); }));
$('fSpeed').addEventListener('input', () => { st.speedAuto = false; });
$('sample').addEventListener('click', () => { loadSample(); schedule(); });
[['fDist', 'dist'], ['fTime', 'time'], ['fSpeed', 'speed'], ['fElev', 'elev'], ['fMax', 'max']].forEach(([id, k]) =>
  $(id).addEventListener('input', e => { st.vals[k] = e.target.value; schedule(); }));
$('scrim').addEventListener('input', e => { st.scrim = e.target.value / 100; schedule(); });
$('zoom').addEventListener('input', e => { st.zoom = e.target.value / 100; schedule(); });
$('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  st.text = b.dataset.v;
  [...$('seg').children].forEach(x => x.setAttribute('aria-pressed', x === b));
  schedule();
});
$('logoSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  st.logo = b.dataset.v === '1';
  [...$('logoSeg').children].forEach(x => x.setAttribute('aria-pressed', x === b)); schedule();
});
const SWS = [['auto', '自動'], ['#a3b17a', 'セージ'], ['#cbc7bf', 'ベージュ'], ['#e9e5dc', 'オフ白'], ['#9db4c8', 'ブルー'], ['#23272d', '墨']];
SWS.forEach(([v, name]) => {
  const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', name);
  if (v === 'auto') { b.className = 'auto'; b.textContent = '自動'; } else b.style.background = v;
  b.setAttribute('aria-pressed', v === 'auto');
  b.addEventListener('click', () => { st.panel = v; [...$('sw').children].forEach(x => x.setAttribute('aria-pressed', x === b)); schedule(); });
  $('sw').appendChild(b);
});
const chips = $('chips');
Object.keys(NAMES).forEach(id => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.textContent = NAMES[id]; b.dataset.id = id;
  b.setAttribute('aria-pressed', id === 'auto');
  b.addEventListener('click', () => {
    if (id === 'auto' && st.preset === 'auto') st.autoIdx++; else if (id === 'auto') st.autoIdx = 0;
    st.preset = id;
    [...chips.children].forEach(x => x.setAttribute('aria-pressed', x === b));
    schedule();
  });
  chips.appendChild(b);
});
function setZoom(z) { st.zoom = clamp(z, 0.5, 4); $('zoom').value = Math.round(st.zoom * 100); }
const ptrs = new Map(); let lastMid = null, lastDist = 0;
function mid() {
  const a = [...ptrs.values()];
  return a.length === 1 ? { x: a[0].x, y: a[0].y, d: 0 }
    : { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2, d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) };
}
cv.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); cv.setPointerCapture(e.pointerId);
  const m = mid(); lastMid = m; lastDist = m.d;
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const m = mid(), k = W / cv.getBoundingClientRect().width;
  st.ox += (m.x - lastMid.x) * k; st.oy += (m.y - lastMid.y) * k;
  if (ptrs.size >= 2 && lastDist > 0) setZoom(st.zoom * m.d / lastDist);
  lastMid = m; lastDist = m.d; schedule();
});
const endP = e => { ptrs.delete(e.pointerId); if (ptrs.size) { const m = mid(); lastMid = m; lastDist = m.d; } };
['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, endP));
cv.addEventListener('wheel', e => { e.preventDefault(); setZoom(st.zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08)); schedule(); }, { passive: false });
$('save').addEventListener('click', () => {
  cv.toBlob(async b => {
    if (!b) { msg('画像を作れませんでした'); return; }
    const f = new File([b], 'ride_card.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f] }); return; } catch (err) { if (err && err.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'ride_card.png';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, 'image/png');
});

/* ---------- start ---------- */
loadSample(); render();
if (document.fonts && document.fonts.load) {
  Promise.all(['400 40px "Barlow"', '500 40px "Barlow"', '600 80px "Barlow"', '500 40px "Barlow Condensed"', '600 80px "Barlow Condensed"', '700 80px "Barlow Condensed"']
    .map(f => document.fonts.load(f))).then(schedule).catch(() => {});
}
})();
